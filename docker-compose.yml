services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
      args:
        - OPENCLAW_GIT_REF=${OPENCLAW_GIT_REF:-latest-release}
        - AGENT_BROWSER_VERSION=latest
    image: openclaw:latest
    ports:
      - "8081:8080"
    healthcheck:
      # Use nginx readiness endpoint. Returns 503 until the gateway is up.
      test:
        [
          "CMD-SHELL",
          'curl -fsS "http://127.0.0.1:${PORT:-8080}/healthz" >/dev/null',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    environment:
      # Infisical via Universal Auth (preferred for Coolify). Keep defaults in
      # Compose so Coolify only needs the machine-identity vars + project/API URL.
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-}
      - INFISICAL_ENV=${INFISICAL_ENV:-prod}
      - INFISICAL_PATH=${INFISICAL_PATH:-/}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID:-}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET:-}
      - INFISICAL_API_URL=${INFISICAL_API_URL:-}

      # Provider (at least one required)
      #- ANTHROPIC_API_KEY=sk-ant-...
      # If you're not using Infisical, set provider keys directly as env vars.
      # - GEMINI_API_KEY=...
      #
      # Other runtime secrets (if not using Infisical):
      # - OPENCLAW_GATEWAY_TOKEN=...
      # - OPENCLAW_EXEC_SOCKET_TOKEN=...
      # Cloudflare Access is the primary edge auth layer; keep nginx basic auth off.
      - OPENCLAW_BASIC_AUTH=off
      # - OPENCLAW_PRIMARY_MODEL=...
      # Persisted state/workspace paths (align runtime + interactive CLI sessions)
      - OPENCLAW_STATE_DIR=/data/.openclaw
      - OPENCLAW_WORKSPACE_DIR=/data/workspace
      - HOME=/data
      # Browser sidecar
      - BROWSER_CDP_URL=http://browser:9223
      - BROWSER_DEFAULT_PROFILE=openclaw
      - BROWSER_EVALUATE_ENABLED=true
      - BROWSER_REMOTE_TIMEOUT_MS=20000
      - BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS=30000
      # Camofox Browser plugin (optional; requires camofox service below)
      # Enables anti-detection browser automation + cookie import tooling.
      - CAMOFOX_BROWSER_URL=http://camofox:9377
      - CAMOFOX_BROWSER_AUTOSTART=false
      # Keep camofox plugin on latest by default (or pin a specific version).
      - CAMOFOX_PLUGIN_VERSION=latest
      # Hooks (optional)
      # - HOOKS_ENABLED=true
      # - HOOKS_TOKEN=my-hook-secret
    volumes:
      - openclaw-data:/data
      # Custom JSON config is baked into the image at /app/config/openclaw.json.
      # For runtime overrides, point OPENCLAW_CUSTOM_CONFIG to a file on persistent storage.
    depends_on:
      - browser
      - camofox
    mem_limit: 5g
    mem_reservation: 1536m
    restart: unless-stopped

  browser:
    image: coollabsio/openclaw-browser:latest
    pull_policy: always
    # No port exposure needed — proxied via openclaw at /browser/
    healthcheck:
      # Chrome DevTools proxy (nginx) is exposed on 9223 in this image.
      test:
        [
          "CMD-SHELL",
          'curl -fsS "http://127.0.0.1:9223/json/version" >/dev/null',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--remote-debugging-address=0.0.0.0 --remote-debugging-port=9222
    volumes:
      - browser-data:/config
    shm_size: 2g
    mem_limit: 5g
    mem_reservation: 1536m
    restart: unless-stopped

  camofox:
    build:
      context: ./camofox-browser
      pull: true
      args:
        - CAMOFOX_BROWSER_NPM_TAG=${CAMOFOX_BROWSER_NPM_TAG:-latest}
    # Internal-only: no ports mapping. OpenClaw reaches it via Docker DNS: http://camofox:9377
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS "http://127.0.0.1:${CAMOFOX_PORT:-9377}/health" >/dev/null',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    environment:
      - CAMOFOX_PORT=9377
      # Reuse the same Universal Auth Infisical config so camofox can inject
      # secrets like CAMOFOX_API_KEY at runtime too.
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-}
      - INFISICAL_ENV=${INFISICAL_ENV:-prod}
      - INFISICAL_PATH=${INFISICAL_PATH:-/}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID:-}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET:-}
      - INFISICAL_API_URL=${INFISICAL_API_URL:-}
    shm_size: 2g
    mem_limit: 1536m
    mem_reservation: 512m
    restart: unless-stopped

volumes:
  openclaw-data:
  browser-data:
